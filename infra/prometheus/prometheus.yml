global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flagforge-api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'flagforge-evaluator'
    static_configs:
      - targets: ['evaluator:3002']
    metrics_path: /metrics
    scrape_interval: 10s
