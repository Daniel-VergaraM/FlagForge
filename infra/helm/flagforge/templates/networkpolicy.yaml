        - podSelector:
            matchLabels:
              {{- include "flagforge.componentSelectorLabels" (dict "root" . "component" "web") | nindent 14 }}
        {{- toYaml $ingressControllerFrom | nindent 8 }}
        {{- toYaml $monitoringFrom | nindent 8 }}
