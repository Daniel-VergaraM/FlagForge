{{/*
Basic network segmentation: default-deny ingress for every pod in the
release, then narrow allow rules for the traffic that actually needs to
flow (mirrors who-calls-whom in docker-compose's single flat network, but
now enforced instead of implicit). Egress is intentionally left unrestricted
(no egress policyTypes) - locking egress down too requires allow-listing DNS
and every external endpoint (OTEL collector, image registry, etc.) which is
easy to get subtly wrong and out of scope for a "basic" policy set; call out
in README as the natural next step for a real production cluster.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flagforge.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flagforge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
{{- $monitoringFrom := list
  (dict "namespaceSelector" (dict "matchLabels" (dict $.Values.networkPolicy.ingressControllerNamespaceLabel $.Values.networkPolicy.monitoringNamespaceValue)))
  (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "prometheus")))
}}
{{- $ingressControllerFrom := list
  (dict "namespaceSelector" (dict "matchLabels" (dict $.Values.networkPolicy.ingressControllerNamespaceLabel $.Values.networkPolicy.ingressControllerNamespaceValue)))
}}

{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flagforge.componentName" (dict "root" . "component" "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flagforge.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flagforge.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "flagforge.componentSelectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - port: 5432
{{- end }}

