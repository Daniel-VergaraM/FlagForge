apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flagforge.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flagforge.labels" . | nindent 4 }}
data:
  # Shared, non-secret connection endpoints - in-cluster DNS names resolved
  # via the Services defined in postgres.yaml / redis.yaml / nats.yaml.
  #
  # Two different Redis key formats on purpose: the API's ioredis client
  # parses a full "redis://host:port" URL, while the Go evaluator's
  # go-redis client takes a bare "host:port" Addr - see apps/api/src/flags/
  # flags.service.ts vs apps/evaluator/internal/cache/redis.go.
  REDIS_URL: "redis://{{ include "flagforge.componentName" (dict "root" . "component" "redis") }}:6379"
  REDIS_ADDR: "{{ include "flagforge.componentName" (dict "root" . "component" "redis") }}:6379"
  NATS_URL: "nats://{{ include "flagforge.componentName" (dict "root" . "component" "nats") }}:4222"

  NODE_ENV: {{ .Values.global.environment | default "production" | quote }}

  API_PORT: "3001"
  EVALUATOR_PORT: "3002"
  WEB_PORT: "3000"

  OTEL_ENABLED: {{ .Values.api.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: "flagforge-api"

  API_BASE_URL: "http://{{ include "flagforge.componentName" (dict "root" . "component" "api") }}"
  NEXTAUTH_TRUST_HOST: "true"
  {{- $host := printf "app.%s" .Values.global.domain }}
  {{- $scheme := ternary "https" "http" .Values.ingress.tls.enabled }}
  NEXTAUTH_URL: {{ .Values.web.nextAuth.url | default (printf "%s://%s" $scheme $host) | quote }}
