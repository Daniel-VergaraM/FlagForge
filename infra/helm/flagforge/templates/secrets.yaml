{{/*
Every credential below is either:
  (a) read back from the previous release's Secret (so `helm upgrade` never
      rotates a live password), or
  (b) explicitly supplied via values / --set (BYO secret for real prod), or
  (c) randomly generated on first install.
This makes `helm install` work with zero manual secret prep (good for a
kind/minikube demo) while still supporting "bring your own secret manager"
for production - see README "Secrets in production".
*/}}

{{- if not .Values.postgres.auth.existingSecret }}
{{- $pgSecretName := printf "%s-postgres" (include "flagforge.fullname" .) }}
{{- $pgPassword := include "flagforge.getOrGeneratePassword" (dict "root" . "explicit" .Values.postgres.auth.password "secretName" $pgSecretName "key" "POSTGRES_PASSWORD" "length" 24) }}
{{- $databaseUrl := printf "postgresql://%s:%s@%s:5432/%s?schema=public" .Values.postgres.auth.user $pgPassword (include "flagforge.componentName" (dict "root" . "component" "postgres")) .Values.postgres.auth.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flagforge.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.user | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
{{- end }}

---
{{- $webSecretName := printf "%s-web" (include "flagforge.fullname" .) }}
{{- $nextAuthSecret := include "flagforge.getOrGeneratePassword" (dict "root" . "explicit" .Values.web.nextAuth.secret "secretName" $webSecretName "key" "NEXTAUTH_SECRET" "length" 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $webSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flagforge.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ $nextAuthSecret | quote }}

{{- if .Values.monitoring.standalone.enabled }}
---
{{- $grafanaSecretName := printf "%s-grafana" (include "flagforge.fullname" .) }}
{{- $grafanaPassword := include "flagforge.getOrGeneratePassword" (dict "root" . "explicit" .Values.monitoring.standalone.grafana.adminPassword "secretName" $grafanaSecretName "key" "GF_SECURITY_ADMIN_PASSWORD" "length" 20) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $grafanaSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flagforge.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: {{ .Values.monitoring.standalone.grafana.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ $grafanaPassword | quote }}
{{- end }}
