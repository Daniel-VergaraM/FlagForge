# Overrides for a managed Kubernetes cluster (EKS/GKE/AKS or similar) - see
# README "Deploying to a managed cluster". Replace the placeholder registry,
# domain and storage class below with your own before installing.
#
# Usage:
#   helm install flagforge ./infra/helm/flagforge -f values-prod.yaml \
#     --set global.imageRegistry=ghcr.io/your-org \
#     --set api.image.tag=v0.2.0 --set evaluator.image.tag=v0.2.0 --set web.image.tag=v0.2.0

global:
  domain: flagforge.io # CHANGE ME
  imageRegistry: ghcr.io/daniel-vergaram # CHANGE ME - build & push flagforge/{api,evaluator,web}
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: ghcr-pull-secret
  storageClass: gp3 # CHANGE ME - e.g. "gp3" (EKS), "premium-rwo" (GKE), "managed-csi" (AKS)

api:
  replicaCount: 3
  image:
    tag: "" # CHANGE ME - pin a real, immutable tag (never :latest in prod)
  resources:
    requests:
      cpu: 200m
      memory: 320Mi
    limits:
      cpu: 1000m
      memory: 640Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  otel:
    # Point at a real OTEL collector once one is deployed; left off by
    # default because this chart doesn't bundle one.
    enabled: false

evaluator:
  replicaCount: 3
  image:
    tag: ""
  resources:
    requests:
      cpu: 300m
      memory: 96Mi
    limits:
      cpu: 300m # requests == limits: Guaranteed QoS, no CFS throttling on the hot path
      memory: 192Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 55
    # Once the Prometheus Adapter is installed against the ServiceMonitor
    # below, prefer scaling on real request throughput over the CPU proxy:
    customMetrics:
      enabled: false
      metricName: flagforge_evaluator_requests_per_second
      targetAverageValue: "800"
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

web:
  replicaCount: 3
  image:
    tag: ""
  resources:
    requests:
      cpu: 150m
      memory: 320Mi
    limits:
      cpu: 600m
      memory: 640Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

postgres:
  # A single-replica in-cluster StatefulSet is a deliberate scope cut for
  # this portfolio chart, not a production recommendation - see README
  # "Design trade-offs: Postgres HA". For a real deployment, point this at
  # a managed Postgres (RDS/Cloud SQL/Azure Database) instead:
  #   postgres.enabled: false
  #   (then set DATABASE_URL yourself via api.extraEnv or a pre-existing Secret)
  persistence:
    size: 50Gi
    storageClass: "" # inherits global.storageClass
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  auth:
    # BYO secret in real production instead of the auto-generated one:
    # existingSecret: flagforge-postgres-external
    existingSecret: ""

redis:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi

nats:
  jetstream:
    persistence:
      size: 5Gi
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

ingress:
  tls:
    enabled: true
    secretName: flagforge-tls
    # Requires cert-manager installed with a ClusterIssuer of this name.
    clusterIssuer: letsencrypt-prod
  exposeMetrics: false # scrape in-cluster via the ServiceMonitor instead

networkPolicy:
  enabled: true

monitoring:
  # Assumes kube-prometheus-stack (or another Prometheus Operator install)
  # is already running in the "monitoring" namespace.
  standalone:
    enabled: false
  serviceMonitor:
    enabled: true
    namespace: monitoring
